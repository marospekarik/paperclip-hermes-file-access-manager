name: CI

# Builds, typechecks, and runs BOTH the unit suite and the mandatory real-Docker
# integration suite. The integration suite launches actual containers and fails
# the build if any filesystem permission or volume mount behaves differently
# than configured. Runs on Linux, whose runners ship Docker preinstalled; macOS
# is covered by the same suite run locally (GitHub's macOS runners can't provide
# a working Docker daemon).

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify Docker is available
        run: docker version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Pre-pull test image
        run: docker pull alpine:3.20

      - name: Integration tests (real Docker)
        run: bun run test:integration

      # Belt-and-braces: sweep any containers a crashed/timed-out test leaked,
      # so a runner is never left dirty. Label-scoped, always runs.
      - name: Reap leftover test containers
        if: always()
        run: docker rm -f $(docker ps -aq --filter label=fam-test=1) 2>/dev/null || true
